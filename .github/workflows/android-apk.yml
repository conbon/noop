# Builds installable Android APKs and publishes them where they're easy to grab:
#   • every run   → workflow artifacts (Actions tab → run → "Artifacts")
#   • tags `v*`   → a GitHub Release with the APKs attached (no login needed to download)
#
# Release builds are always installable even without signing secrets: when
# `keystore.properties` is absent the build signs with the debug key (see
# android/app/build.gradle.kts). Both flavors are built — "full" (the real app)
# and "demo" (preloaded synthetic data) — and they install side-by-side.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Create a GitHub Release under this tag (e.g. v0.1.0). The tag is
          created on the built commit if it doesn't exist. Leave empty to
          just build and upload artifacts.
        required: false
        default: ""

permissions:
  contents: write # needed by the release job to attach APKs to a tag

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs (full + demo)
        run: ./gradlew --no-daemon assembleFullRelease assembleDemoRelease

      - name: Upload full APK
        uses: actions/upload-artifact@v4
        with:
          name: noop-full-release
          path: android/app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: noop-demo-release
          path: android/app/build/outputs/apk/demo/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Empty on tag pushes, where the action defaults to the pushed tag.
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/full/release/*.apk
            android/app/build/outputs/apk/demo/release/*.apk
